<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>GOAL GETTER 2.0 | Football Community</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Rajdhani:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050806;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    padding: 14px;
}

.page {
    width: 100%;
    max-width: 430px;
    height: min(790px, calc(100dvh - 28px));
    min-height: 530px;
    position: relative;
    overflow: hidden;
    border-radius: 25px;
    background:
        radial-gradient(ellipse at 50% 28%, rgba(175,145,66,0.13), transparent 48%),
        linear-gradient(155deg, #101914 0%, #080d0a 45%, #050706 100%);
    border: 1px solid rgba(204,177,105,0.23);
    box-shadow: 0 20px 70px rgba(0,0,0,0.65);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 27px 23px 16px;
}

/* Background elements */

.glow {
    position: absolute;
    width: 270px;
    height: 270px;
    border-radius: 50%;
    background: rgba(190,157,82,0.09);
    filter: blur(80px);
    top: 15%;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
}

.pitch {
    position: absolute;
    width: 330px;
    height: 330px;
    border: 1px solid rgba(190,157,82,0.055);
    border-radius: 50%;
    top: 25%;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
}

.pitch::before {
    content: "";
    position: absolute;
    inset: 35px;
    border: 1px solid rgba(190,157,82,0.055);
    border-radius: 50%;
}

.pitch::after {
    content: "";
    position: absolute;
    height: 100%;
    width: 1px;
    background: rgba(190,157,82,0.06);
    left: 50%;
}

/* Header */

.topbar {
    position: relative;
    z-index: 2;
    width: 100%;
    display: flex;
    justify-content: center;
}

.status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 15px;
    border: 1px solid rgba(201,174,104,0.25);
    background: rgba(201,174,104,0.07);
    border-radius: 30px;
    font-size: 10px;
    letter-spacing: 2px;
    color: #d7c18b;
    font-weight: 600;
}

.dot {
    width: 6px;
    height: 6px;
    background: #b9d88b;
    border-radius: 50%;
    box-shadow: 0 0 9px #b9d88b;
}

/* Logo */

.logo-area {
    position: relative;
    z-index: 2;
    margin-top: 34px;
    width: 155px;
    height: 155px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.logo-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(202,174,104,0.45);
    box-shadow: 0 0 30px rgba(202,174,104,0.10);
    animation: rotate 18s linear infinite;
}

.logo-ring::before {
    content: "";
    position: absolute;
    width: 8px;
    height: 8px;
    background: #d2b56e;
    border-radius: 50%;
    top: 15px;
    left: 23px;
    box-shadow: 0 0 12px #d2b56e;
}

.logo-inner {
    width: 128px;
    height: 128px;
    border-radius: 50%;
    background: linear-gradient(145deg, #1b2820, #080c09);
    border: 1px solid rgba(218,190,122,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 0 35px rgba(0,0,0,0.7);
}

.logo-inner img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 8px;
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

/* Branding */

.brand {
    position: relative;
    z-index: 2;
    margin-top: 25px;
}

.eyebrow {
    font-family: 'Rajdhani', sans-serif;
    color: #c4a968;
    font-size: 12px;
    letter-spacing: 5px;
    font-weight: 600;
    margin-bottom: 8px;
}

.brand h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(27px, 8vw, 35px);
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: 1px;
    background: linear-gradient(180deg, #fff5d7, #d1b16b 55%, #8e7540);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.brand h1 span {
    display: block;
    font-size: 20px;
    letter-spacing: 9px;
    margin-top: 5px;
    padding-left: 9px;
}

.separator {
    width: 75px;
    height: 1px;
    margin: 19px auto;
    background: linear-gradient(90deg, transparent, #c4a968, transparent);
}

.description {
    position: relative;
    z-index: 2;
    max-width: 290px;
    font-size: 12px;
    line-height: 1.8;
    color: #aeb7af;
    letter-spacing: 0.3px;
}

/* Highlights */

.highlights {
    position: relative;
    z-index: 2;
    width: 100%;
    display: flex;
    gap: 8px;
    margin-top: 25px;
}

.highlight {
    flex: 1;
    padding: 12px 5px;
    background: linear-gradient(145deg, rgba(255,255,255,0.055), rgba(255,255,255,0.015));
    border: 1px solid rgba(198,170,103,0.15);
    border-radius: 12px;
}

.highlight .icon {
    font-size: 17px;
    margin-bottom: 6px;
}

.highlight p {
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: #d8c38d;
    letter-spacing: 0.7px;
}

/* CTA */

.cta-area {
    position: relative;
    z-index: 2;
    width: 100%;
    margin-top: auto;
    padding-top: 25px;
}

.cta-label {
    font-size: 10px;
    color: #8c968e;
    letter-spacing: 2px;
    margin-bottom: 12px;
    font-weight: 500;
}

.join-btn {
    position: relative;
    width: 100%;
    min-height: 57px;
    border: 1px solid #e3ca89;
    border-radius: 12px;
    background: linear-gradient(110deg, #b18c45, #e2c986, #a98843);
    color: #10130d;
    font-family: 'Rajdhani', sans-serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    overflow: hidden;
    box-shadow: 0 5px 25px rgba(185,150,75,0.22);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.join-btn:active {
    transform: scale(0.97);
}

.join-btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: skewX(-20deg);
    animation: shine 4s infinite;
}

@keyframes shine {
    0%, 65% { left: -120%; }
    100% { left: 150%; }
}

.btn-content {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
}

.arrow {
    font-size: 20px;
}

/* Footer */

.footer {
    position: relative;
    z-index: 2;
    margin-top: 18px;
    width: 100%;
}

.footer p {
    font-size: 9px;
    color: #69756c;
    letter-spacing: 1.1px;
    line-height: 1.7;
}

.footer strong {
    color: #b9a16a;
    font-weight: 500;
}

/* Small screens */

@media(max-height: 650px) {
    .page {
        padding-top: 15px;
        padding-bottom: 10px;
    }

    .logo-area {
        width: 110px;
        height: 110px;
        margin-top: 17px;
    }

    .logo-inner {
        width: 90px;
        height: 90px;
    }

    .brand {
        margin-top: 14px;
    }

    .separator {
        margin: 12px auto;
    }

    .highlights {
        margin-top: 15px;
    }

    .cta-area {
        padding-top: 15px;
    }

    .footer {
        margin-top: 10px;
    }
}

<body>
